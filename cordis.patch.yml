# dsh-git-graph: Git view plugin.
#
# - host half (this package's `main`): a `/vsc-git-graph` JSON API that runs `git` in
#   the requested directory (status / diff / log / commit / branch / push /
#   pull / blame / cat 等).
# - client half (this package's `./client`): a Git tab UI bound to the
#   current session's working directory.
- insert:
    - id: vsc-git-graph
      name: 'dsh-vsc-git-graph'
